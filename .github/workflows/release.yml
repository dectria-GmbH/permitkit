name: release

on:
  push:
    # Plain versions only. Pre-release tags such as v1.0.0-rc.1 do not start this workflow.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One release at a time, also across tags, so an older version cannot publish after a newer one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Actions are pinned by commit SHA. The comment names the tag the SHA was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tagged commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Commit $TAG_SHA is not on origin/main. Release tags must point to a commit on main." >&2
            exit 1
          fi
      - name: Check that the tag equals the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run every gate
        run: pnpm check
      - name: Pack the tarball
        run: |
          mkdir pack
          npm pack --ignore-scripts --pack-destination pack
          ls pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7
      # The same check as the node-floor job in ci.yml: the build must take the Node path on the
      # engines floor. CI results do not gate a merge, so the release runs it again.
      # It runs after the pack step, so npm from Node 24 packs the tarball. If it fails, the
      # publish job does not start.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.3.0
      - name: Smoke the build on Node 22.3.0
        run: |
          test "$(node --version)" = v22.3.0
          node scripts/smoke.mjs

  publish:
    name: publish to npm
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment "npm" holds the required reviewer and the tag limit (repository setting).
    # The npm trusted publisher names the same environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing needs npm CLI 11.5.1 or later and Node 22.14.0 or later (npm docs,
      # "Trusted publishing"). The npm bundled with Node 24 is newer. Fail if it is not.
      - name: Check the npm version
        run: |
          CURRENT="$(npm --version)"
          echo "npm $CURRENT"
          if [ "$(printf '%s\n' 11.5.1 "$CURRENT" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $CURRENT is older than 11.5.1, which trusted publishing needs" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack
      # No NPM_TOKEN, no checkout and no dependency install: npm exchanges the GitHub OIDC token
      # for a short-lived publish credential and publishes the tarball that the check job built.
      - name: Publish the tarball
        run: |
          # An unmatched glob stays as the literal pattern, so also test that the file exists.
          set -- pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one tarball in pack/, found: $*" >&2
            exit 1
          fi
          npm publish "$1" --provenance --access public
