name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA. The comment names the tag the SHA was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Import built entry points
        run: pnpm smoke
      # The same checks as the tail of `pnpm check`, so a PR cannot break the release build.
      - name: Bundle without Node built-ins
        run: pnpm bundle-check
      - name: Compile a consumer file against the built types
        run: pnpm consumer-types
      - name: Check the files that the npm tarball holds
        run: pnpm pack-check
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

  # engines.node is 22.3.0 because process.getBuiltinModule arrived there. Build on Node 24, then
  # load the build on the floor version. The full test suite needs Error.isError (Node 24), so
  # only the smoke script runs here: it fails if dist/plain.js falls back to the portable path.
  node-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build on Node 24
        run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.3.0
      - name: Smoke the build on Node 22.3.0
        run: |
          test "$(node --version)" = v22.3.0
          node scripts/smoke.mjs
